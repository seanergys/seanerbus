[package]
name = "seanerbus_msg"
version = "0.1.0"
edition = "2024"

include = [
"bindings/rust/*"
]
build = "bindings/rust/build.rs"

[lib]
path = 'bindings/rust/lib.rs'
[dependencies]
capnp = "0.25.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
uuid = { version = "1.23.0", features = ["serde", "v4"] }

[build-dependencies]
capnpc = "0.25.0"
