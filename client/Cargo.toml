[package]
name = "seanerbus_client"
version = "0.1.0"
edition = "2024"

include = [
"bindings/rust/*"
]

[lib]
path = 'bindings/rust/lib.rs'

[dependencies]

seanerbus_async = { path = "../async"}
seanerbus_schemas = { path = "../internal_schemas"}
seanerbus_msg = { path = "../msg"}
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
uuid = { version = "1.23.0", features = ["serde", "v4"] }
serde = { version = "1.0.228", features = ["derive"] }

[[bin]]
name = "subscribe_test"
path = "examples/subscribe_test/src/main.rs"


[[bin]]
name = "publish_test"
path = "examples/publish_test/src/main.rs"


[[bin]]
name = "request_test"
path = "examples/request_test/src/main.rs"

[[bin]]
name = "response_test"
path = "examples/response_test/src/main.rs"


