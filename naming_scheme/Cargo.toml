[package]
name = "naming_scheme"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "request_test"
path = "src/request_test/src/main.rs"

[[bin]]
name = "naming_server"
path = "src/naming_server/src/main.rs"

[dependencies]

seanerbus_client = { path = '../client' } 
seanerbus_msg = { path = '../msg' } 
seanerbus_schemas = { path = '../internal/internal_schemas' } 
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["full"] }
tracing-subscriber = "0.3.23"
uuid = { version = "1.23.0", features = ["v4"] }
