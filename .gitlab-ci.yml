stages:
  - prebuild
  - build
  - test
  - docs
  - end_to_end

before_script:
  ##
  ## Install ssh-agent if not already installed, it is required by Docker.
  ## (change apt-get to yum if you use an RPM-based image)
  ##
  - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client git -y )'

  ##
  ## Run ssh-agent (inside the build environment)
  ##
  - eval $(ssh-agent -s)

  ##
  ## Give the right permissions, otherwise ssh-add will refuse to add files
  ## Add the SSH key stored in SSH_PRIVATE_KEY file type CI/CD variable to the agent store
  ##
  - chmod 400 "$SSH_PRIVATE_KEY"
  - ssh-add "$SSH_PRIVATE_KEY"
  - chmod 400 "$SSH_PRIVATE_KEY2"
  - ssh-add "$SSH_PRIVATE_KEY2"

  ##
  ## Create the SSH directory and give it the right permissions
  ##
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
  - chmod 644 ~/.ssh/known_hosts

  ##
  ## Optionally, if you use Git commands, set the user name and email.
  ##
  - git config --global user.email "user@example.com"
  - git config --global user.name "User name"
  - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.seanergys.fz-juelich.de/software/seanerbus-msg.git".insteadOf git@gitlab.seanergys.fz-juelich.de:software/seanerbus-msg.git

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_INCREMENTAL: 0
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG
  DOCKER_IMAGE_TAG: $CI_COMMIT_SHA
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"

reuse-lint:
  stage: prebuild
  image: python:latest
  script:
    - pip install reuse
    - reuse lint

cpp-clang-format:
  image: debian:testing-slim
  stage: prebuild
  script:
    - apt-get update && apt-get install -y clang-format git
    - git-clang-format HEAD~1

docs:docs:
  image: python:latest
  stage: docs
  script:
    - apt-get update && apt-get install -y rustup
    - apt-get update && apt-get install -y cmake capnproto libcapnp-dev doxygen
    - rustup default stable
    - cargo install sphinx-rustdocgen
    - pip install uv
    - cd docs
    - PATH="/builds/software/seanerbus/.cargo/bin/:$PATH" ./make_docs.sh

docs:deploy:
  image: python:latest
  stage: docs
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - apt-get update && apt-get install -y rustup
    - apt-get update && apt-get install -y cmake capnproto libcapnp-dev doxygen
    - rustup default stable
    - cargo install sphinx-rustdocgen
    - pip install uv
    - cd docs
    - PATH="/builds/software/seanerbus/.cargo/bin/:$PATH" ./make_docs.sh
  pages: true
  artifacts:
    paths:
      - public

sub_python_pub_cpp:
  image: python:latest
  stage: end_to_end
  script:
    - apt-get update && apt-get install -y cmake capnproto pkg-config libcapnp-dev git rustup build-essential
    - rustup default stable
    - pip install uv
    - cd scenario_tests/sub_python_pub_cpp/
    - ./sub_python_pub_cpp.sh

req_python_res_python_array:
  image: python:latest
  stage: end_to_end
  script:
    - apt-get update && apt-get install -y cmake capnproto pkg-config libcapnp-dev git rustup build-essential
    - rustup default stable
    - pip install uv
    - cd scenario_tests/req_python_res_python_array
    - ./req_python_res_python_array.sh

