stages:
  - prebuild
  - build
  - test
  - docs
  - end_to_end

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_INCREMENTAL: 0
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG
  DOCKER_IMAGE_TAG: $CI_COMMIT_SHA
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  GIT_SUBMODULE_STRATEGY: recursive

reuse-lint:
  stage: prebuild
  image: python:latest
  script:
    - pip install reuse
    - reuse lint

cpp-clang-format:
  image: debian:testing-slim
  stage: prebuild
  script:
    - apt-get update && apt-get install -y clang-format git
    - git-clang-format HEAD~1


build-rust:
  image: debian:testing-slim
  stage: build
  script:
    - apt-get update && apt-get install -y capnproto rustup build-essential
    - rustup default stable
    - cd server
    - cargo build --release
    - cd ../rust_examples
    - cargo build --release
  allow_failure: false

build-cpp:
  image: debian:testing-slim
  stage: build
  script:
    - apt-get update && apt-get install -y catch2 libcatch2-dev cmake capnproto pkg-config libcapnp-dev git build-essential
    - cd bindings/cpp
    - mkdir build
    - cd build
    - cmake .. -DCMAKE_INSTALL_PREFIX=../../../install_seanerbus
    - make -j4 install
    - make test
    - cd ../../../contrib/pkgconfig_build_test
    - cmake . -DCMAKE_PREFIX_PATH=../../install_seanerbus
    - make -j4
    - cd ../cmake_config_build_test
    - cmake . -DCMAKE_PREFIX_PATH=../../install_seanerbus
    - make -j4
    - cd ../../database
    - cmake .
    - make -j4



build-python:
  image: python:latest
  stage: build
  script:
    - apt-get update && apt-get install -y cmake capnproto libcapnp-dev
    - pip install bindings/python

test:rust-unit:
  image: debian:testing-slim
  stage: test
  script:
    - apt-get update && apt-get install -y capnproto rustup build-essential
    - rustup default stable
    - cd server
    - cargo test --verbose
    - cd ../rust_examples
    - cargo test --verbose


test:rust-clippy:
  image: debian:testing-slim
  stage: test
  script:
    - apt-get update && apt-get install -y capnproto rustup build-essential
    - rustup default stable
    - rustup component add clippy
    - cd server
    - cargo clippy -- -D warnings
    - cd ../rust_examples
    - cargo clippy -- -D warnings
  allow_failure: true

test:rust-format:
  image: debian:testing-slim
  stage: test
  script:
    - apt-get update && apt-get install -y capnproto rustup build-essential
    - rustup default stable
    - rustup component add rustfmt
    - cd server
    - cargo fmt -- --check
    - cd ../rust_examples
    - cargo fmt -- --check
  allow_failure: true

docs:docs:
  image: python:latest
  stage: docs
  script:
    - apt-get update && apt-get install -y rustup
    - apt-get update && apt-get install -y cmake capnproto libcapnp-dev doxygen
    - rustup default stable
    - cargo install sphinx-rustdocgen
    - pip install uv
    - cd docs
    - PATH="/builds/software/seanerbus/.cargo/bin/:$PATH" ./make_docs.sh

docs:deploy:
  image: python:latest
  stage: docs
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - apt-get update && apt-get install -y rustup
    - apt-get update && apt-get install -y cmake capnproto libcapnp-dev doxygen
    - rustup default stable
    - cargo install sphinx-rustdocgen
    - pip install uv
    - cd docs
    - PATH="/builds/software/seanerbus/.cargo/bin/:$PATH" ./make_docs.sh
  pages: true
  artifacts:
    paths:
      - public

sub_python_pub_cpp:
  image: python:latest
  stage: end_to_end
  script:
    - apt-get update && apt-get install -y cmake capnproto pkg-config libcapnp-dev git rustup build-essential
    - rustup default stable
    - pip install uv
    - cd scenario_tests/sub_python_pub_cpp/
    - ./sub_python_pub_cpp.sh

req_python_res_python_array:
  image: python:latest
  stage: end_to_end
  script:
    - apt-get update && apt-get install -y cmake capnproto pkg-config libcapnp-dev git rustup build-essential
    - rustup default stable
    - pip install uv
    - cd scenario_tests/req_python_res_python_array
    - ./req_python_res_python_array.sh

