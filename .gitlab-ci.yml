stages:
  - prebuild
  - build
  - test
  - docs
  - end_to_end

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_INCREMENTAL: 0
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG
  DOCKER_IMAGE_TAG: $CI_COMMIT_SHA

check-differ-capnp:
  stage: prebuild
  image: python:latest
  script:
    - diff -u --color=always  msg/schemas/msg.capnp bindings/python/src/seanerbus/msg/msg.capnp
    - diff -u --color=always internal/internal_schemas/schemas/internal.capnp bindings/python/src/seanerbus/client/internal.capnp 

reuse-lint:
  stage: prebuild
  image: python:latest
  script:
    - pip install reuse
    - reuse lint

cpp-clang-format:
  image: debian:testing-slim
  stage: prebuild
  script:
    - apt-get update && apt-get install -y clang-format git
    - git-clang-format HEAD~1


build-rust:
  image: debian:testing-slim
  stage: build
  script:
    - apt-get update && apt-get install -y capnproto rustup build-essential
    - rustup default stable
    - cd server
    - cargo build --release
    - cd ../rust_examples
    - cargo build --release
  allow_failure: false

build-cpp:
  image: debian:testing-slim
  stage: build
  script:
    - apt-get update && apt-get install -y cmake capnproto pkg-config libcapnp-dev git build-essential
    - git submodule update --init --recursive
    - cd cpp_examples
    - cmake . -DCMAKE_INSTALL_PREFIX=../../install_seanerbus
    - make -j4 install
    - cd ../contrib/pkgconfig_build_test
    - cmake . -DCMAKE_PREFIX_PATH=../../../install_seanerbus
    - make -j4
    - cd ../cmake_config_build_test
    - cmake . -DCMAKE_PREFIX_PATH=../../../install_seanerbus
    - make -j4



build-python:
  image: python:latest
  stage: build
  script:
    - apt-get update && apt-get install -y cmake capnproto libcapnp-dev
    - pip install bindings/python

test:rust-unit:
  image: debian:testing-slim
  stage: test
  script:
    - apt-get update && apt-get install -y capnproto rustup build-essential
    - rustup default stable
    - cd server
    - cargo test --verbose
    - cd ../rust_examples
    - cargo test --verbose


test:rust-clippy:
  image: debian:testing-slim
  stage: test
  script:
    - apt-get update && apt-get install -y capnproto rustup build-essential
    - rustup default stable
    - rustup component add clippy
    - cd server
    - cargo clippy -- -D warnings
    - cd ../rust_examples
    - cargo clippy -- -D warnings
  allow_failure: true

test:rust-format:
  image: debian:testing-slim
  stage: test
  script:
    - apt-get update && apt-get install -y capnproto rustup build-essential
    - rustup default stable
    - rustup component add rustfmt
    - cd server
    - cargo fmt -- --check
    - cd ../rust_examples
    - cargo fmt -- --check
  allow_failure: true

test:ruff-check:
  image: python:latest
  stage: test
  script:
    - pip install ruff
    - cd bindings/python
    - ruff check
    - cd $CI_PROJECT_DIR
    - cd python_examples
    - ruff check

test:ruff-format:
  image: python:latest
  stage: test
  script:
    - pip install ruff
    - cd bindings/python
    - ruff format --check
    - cd $CI_PROJECT_DIR
    - cd python_examples
    - ruff format --check


docs:docs:
  image: python:latest
  stage: docs
  script:
    - apt-get update && apt-get install -y rustup
    - apt-get update && apt-get install -y cmake capnproto libcapnp-dev doxygen
    - rustup default stable
    - cargo install sphinx-rustdocgen
    - pip install uv
    - cd docs
    - PATH="/builds/software/seanerbus/.cargo/bin/:$PATH" ./make_docs.sh

docs:deploy:
  image: python:latest
  stage: docs
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - apt-get update && apt-get install -y rustup
    - apt-get update && apt-get install -y cmake capnproto libcapnp-dev doxygen
    - rustup default stable
    - cargo install sphinx-rustdocgen
    - pip install uv
    - cd docs
    - PATH="/builds/software/seanerbus/.cargo/bin/:$PATH" ./make_docs.sh
  pages: true
  artifacts:
    paths:
      - public

sub_python_pub_cpp:
  image: python:latest
  stage: end_to_end
  script:
    - apt-get update && apt-get install -y cmake capnproto pkg-config libcapnp-dev git rustup build-essential
    - git submodule update --init --recursive
    - rustup default stable
    - pip install bindings/python
    - cd contrib/scenario_tests
    - mkdir build
    - cd build
    - cmake ..
    - make -j4
    - cd ..
    - ./sub_python_pub_cpp.sh
